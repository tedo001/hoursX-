apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoursx-console
  labels: { app.kubernetes.io/name: hoursx, app.kubernetes.io/component: console }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: hoursx, app.kubernetes.io/component: console }
  template:
    metadata:
      labels: { app.kubernetes.io/name: hoursx, app.kubernetes.io/component: console }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: console
          image: ghcr.io/OWNER/hoursx-console:latest
          ports:
            - { name: http, containerPort: 3400 }
          readinessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: hoursx-console
spec:
  selector: { app.kubernetes.io/name: hoursx, app.kubernetes.io/component: console }
  ports:
    - { name: http, port: 80, targetPort: http }
