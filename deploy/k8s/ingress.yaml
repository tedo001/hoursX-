apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hoursx
  annotations:
    # WebSocket event stream needs a long read timeout.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: hoursx.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend: { service: { name: hoursx-api, port: { number: 80 } } }
          - path: /ws
            pathType: Prefix
            backend: { service: { name: hoursx-api, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: hoursx-console, port: { number: 80 } } }
